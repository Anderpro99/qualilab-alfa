<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>

<script>
const { useState, useRef, useEffect } = React;
const html = htm.bind(React.createElement);

// INÍCIO_CALCULOS

/**
 * Média aritmética:  x̄ = (x1 + x2 + ... + xn) / n
 * Retorna null se não houver resultados.
 */
function calcularMedia(valores) {
  const n = valores.length;
  if (n === 0) return null;
  let soma = 0;
  for (const x of valores) soma += x;
  return soma / n;
}

/**
 * Desvio padrão AMOSTRAL (SD):  s = raiz( Σ(xi − x̄)² / (n − 1) )
 *
 * Usa n − 1 (correção de Bessel) porque os resultados do controle são uma
 * AMOSTRA de todas as medições possíveis do material, e não a população
 * inteira. É o cálculo usado na rotina de controle da qualidade laboratorial.
 *
 * Método de duas passagens: primeiro calcula a média, depois soma os
 * quadrados dos desvios. É numericamente mais estável do que a fórmula
 * "atalho" (Σx² − n·x̄²), que perde precisão com números grandes.
 *
 * Retorna null se n < 2 (com 1 resultado só, n − 1 = 0 e o SD não existe).
 */
function calcularDesvioPadrao(valores) {
  const n = valores.length;
  if (n < 2) return null;
  const media = calcularMedia(valores);
  let somaQuadrados = 0;
  for (const x of valores) somaQuadrados += (x - media) ** 2;
  return Math.sqrt(somaQuadrados / (n - 1));
}

/**
 * Coeficiente de Variação:  CV% = (SD / |média|) × 100
 *
 * Expressa a imprecisão em relação ao tamanho da média, permitindo comparar
 * controles de níveis diferentes. Usa o módulo da média para que o CV não
 * fique negativo. Retorna null se o SD não existe ou se a média é zero
 * (divisão por zero).
 */
function calcularCV(desvioPadrao, media) {
  if (desvioPadrao === null || media === null || media === 0) return null;
  return (desvioPadrao / Math.abs(media)) * 100;
}

/**
 * Converte o texto digitado em número. Aceita vírgula ou ponto decimal
 * ("12,5" ou "12.5"). Retorna null se não for um número válido
 * (vazio, letras, mais de um separador, etc.).
 */
function converterNumero(texto) {
  const limpo = texto.trim();
  if (!/^[-+]?\d+([.,]\d+)?$/.test(limpo)) return null;
  const numero = Number(limpo.replace(",", "."));
  return Number.isFinite(numero) ? numero : null;
}

/**
 * Limites de controle:  valor(k) = média + k × SD,  para k = +3, +2, +1, 0, −1, −2, −3
 *
 * Cada linha de referência do gráfico de Levey-Jennings é a média deslocada
 * k desvios-padrão para cima ou para baixo. Exemplo: média 100 e SD 4 dão
 * +1 SD = 104, +2 SD = 108, +3 SD = 112, −3 SD = 88.
 *
 * Retorna null se a média ou o SD não existem, ou se SD ≤ 0 (todos os
 * resultados iguais): nesse caso as linhas se sobreporiam e não há limites
 * distinguíveis para desenhar.
 */
function calcularLimites(media, desvioPadrao) {
  if (media === null || desvioPadrao === null || desvioPadrao <= 0) return null;
  return [3, 2, 1, 0, -1, -2, -3].map(k => ({ k, valor: media + k * desvioPadrao }));
}

// FIM_CALCULOS

/* Formatação para exibição em português (vírgula decimal). "—" = indisponível. */
function formatar(valor, casas) {
  if (valor === null) return "—";
  return valor.toLocaleString("pt-BR", { minimumFractionDigits: casas, maximumFractionDigits: casas });
}

const MAX_DIAS = 31; // um mês de rotina

/* ---------------- Gráfico de Levey-Jennings (Chart.js) ---------------- */

// Aparência de cada tipo de linha, pela distância da média em SD (|k|).
const ESTILO_LINHAS = {
  0: { cor: "#14422f", largura: 2,   tracejado: [],     nome: "Média" },
  1: { cor: "#8a948e", largura: 1,   tracejado: [2, 4], nome: "±1 SD" },
  2: { cor: "#c77700", largura: 1.5, tracejado: [6, 4], nome: "±2 SD (atenção)" },
  3: { cor: "#b3261e", largura: 1.5, tracejado: [],     nome: "±3 SD (rejeição)" }
};

// Plugin do Chart.js: escreve "+3 SD", "Média" etc. na ponta direita de cada linha.
const pluginRotulosLinhas = {
  id: "rotulosLinhas",
  afterDatasetsDraw(grafico) {
    const { ctx, chartArea } = grafico;
    grafico.data.datasets.forEach((serie, i) => {
      if (!serie.rotuloFim) return;
      const pontos = grafico.getDatasetMeta(i).data;
      if (pontos.length === 0) return;
      ctx.save();
      ctx.fillStyle = serie.borderColor;
      ctx.font = "12px system-ui, sans-serif";
      ctx.textBaseline = "middle";
      ctx.fillText(serie.rotuloFim, chartArea.right + 6, pontos[pontos.length - 1].y);
      ctx.restore();
    });
  }
};

const fmtNum = (v, casas) => v.toLocaleString("pt-BR", { minimumFractionDigits: casas, maximumFractionDigits: casas });

/* =====================================================================
   NOVAS FUNÇÕES DE CÁLCULO (multinível)
   ===================================================================== */
// INÍCIO_CALCULOS_NIVEIS

/**
 * Parâmetros ESPERADOS de um nível (Alvo e SD), a partir do que foi digitado.
 *
 * Modo "sd":    usa o Alvo e o SD informados.
 * Modo "range": o usuário informa o intervalo aceitável [mín, máx] e diz se ele
 *               corresponde a ±2 SD ou ±3 SD (k). Então:
 *                  Alvo = (mín + máx) / 2
 *                  SD   = (máx − mín) / (2 × k)
 *               Ex.: 92 a 108 com k = 2  →  Alvo 100, SD 4.
 *
 * Retorna { alvo, sd } ou null se houver campo vazio/inválido (SD ≤ 0 ou máx ≤ mín).
 */
function calcularParametros(cfg) {
  if (cfg.modo === "sd") {
    const alvo = converterNumero(cfg.alvo), sd = converterNumero(cfg.sd);
    if (alvo === null || sd === null || sd <= 0) return null;
    return { alvo, sd };
  }
  const min = converterNumero(cfg.min), max = converterNumero(cfg.max), k = Number(cfg.k);
  if (min === null || max === null || max <= min) return null;
  return { alvo: (min + max) / 2, sd: (max - min) / (2 * k) };
}

/**
 * Viés (bias) em relação ao alvo:
 *    absoluto   = média obtida − alvo
 *    percentual = (média obtida − alvo) / |alvo| × 100
 * Positivo = resultados acima do alvo; negativo = abaixo.
 * Retorna null se não há média; percentual é null quando o alvo é zero.
 */
function calcularVies(media, alvo) {
  if (media === null || alvo === null) return null;
  const absoluto = media - alvo;
  return { absoluto, percentual: alvo === 0 ? null : (absoluto / Math.abs(alvo)) * 100 };
}

/**
 * Z-Score (também chamado SDI, Índice de Desvio Padrão) de um resultado:
 *
 *      Z = (resultado − alvo) / SD esperado
 *
 * Diz "a quantos desvios-padrão do alvo" o resultado está:
 *    Z = 0   → exatamente no alvo        Z = +2 → 2 SD acima do alvo
 *    Z = −1  → 1 SD abaixo do alvo       |Z| > 3 → além do limite de rejeição
 *
 * Usa o ALVO e o SD ESPERADO da configuração de cada nível (os mesmos que fixam
 * as linhas do gráfico individual), e não a média/SD dos pontos digitados.
 * Por isso níveis com escalas diferentes (ex.: alvo 50 e alvo 200) ficam
 * comparáveis no mesmo eixo, de −3 a +3.
 * Ex.: alvo 100, SD 4, resultado 108 → Z = +2.  Alvo 50, SD 2, resultado 48 → Z = −1.
 *
 * Retorna null se não há valor (dia sem esse nível) ou se o SD é inválido (≤ 0).
 */
function calcularZScore(valor, alvo, sd) {
  if (valor === null || alvo === null || sd === null || sd <= 0) return null;
  return (valor - alvo) / sd;
}

// FIM_CALCULOS_NIVEIS

/* =====================================================================
   ███ MOTOR DE REGRAS DE WESTGARD (lógica pura — sem React, sem DOM) ███
   ---------------------------------------------------------------------
   Entrada : z[nivel][dia] = Z-Score de cada resultado (null = sem resultado).
   Saída   : { violacoes, marcas, ultimoDia, assinatura }
     violacoes → uma entrada por (regra, dia de detecção), mais recentes primeiro
     marcas    → marcas[nivel][dia] = [regras] que envolvem aquele ponto (usado no gráfico)
   Avalia DENTRO de cada nível (histórico) e ENTRE níveis (mesma corrida / pooled).
   ===================================================================== */
// INÍCIO_MOTOR_REGRAS

/* Propriedades FIXAS de cada regra (tipo de erro que ela indica).
   A SEVERIDADE (Desativada / Alerta / Rejeição) NÃO é fixa: vem da configuração (cfg) do laboratório. */
const REGRAS_INFO = {
  "1_2s": { erro: "Indefinido" },
  "1_3s": { erro: "Aleatório" },
  "2_2s": { erro: "Sistemático" },
  "R_4s": { erro: "Aleatório" },
  "4_1s": { erro: "Sistemático" },
  "10_x": { erro: "Sistemático" },
  "7T":   { erro: "Sistemático" }
};
const TIPO_ROTULO = { alerta: "Alerta", rejeicao: "Rejeição" };   // "off" = regra desativada (não é avaliada)
/* Padrões clássicos: valores possíveis de cada regra = "off" | "alerta" | "rejeicao". */
const CFG_PADRAO = { "1_2s": "alerta", "1_3s": "rejeicao", "2_2s": "rejeicao", "R_4s": "rejeicao", "4_1s": "rejeicao", "10_x": "rejeicao", "7T": "alerta" };

/* Texto curto da regra para rótulos no gráfico: "1_3s" → "1₃s", "10_x" → "10x", "7T" → "7T". */
function rotuloTxt(regra) {
  return regra.replace(/_(\d)/, (m, d) => "₀₁₂₃₄₅₆₇₈₉"[d]).replace("_", "");
}

/* Converte as corridas em Z-Scores por nível: z[nivel][dia]. Nível sem parâmetros válidos → só null. */
function montarZ(corridas, parametros) {
  return parametros.map((p, i) => corridas.map(r => (p ? calcularZScore(r[i], p.alvo, p.sd) : null)));
}

function avaliarRegras(z, cfg = CFG_PADRAO) {   // cfg: severidade de cada regra (ver CFG_PADRAO)
  const bruto = [];                                  // violações antes de agrupar
  const on = r => !!cfg[r] && cfg[r] !== "off";           // regra desativada nunca é avaliada
  const add = (regra, pts, escopo) => {
    if (!on(regra)) return;
    bruto.push({ regra, pts, escopo, dia: Math.max(...pts.map(p => p.d)) });
  };

  // Todos os pontos da janela do MESMO lado e além de "lim" SD (lim = 0 → só o lado do alvo).
  const mesmoLado = (jan, lim) => jan.every(p => p.z > lim) || jan.every(p => p.z < -lim);
  const sobe  = jan => jan.every((p, i) => i === 0 || p.z > jan[i - 1].z);
  const desce = jan => jan.every((p, i) => i === 0 || p.z < jan[i - 1].z);

  // Janela deslizante: testa cada grupo de n pontos consecutivos de "seq".
  // exigeMulti = só vale se a janela envolve mais de um nível (análise entre níveis).
  const janelas = (seq, n, teste, regra, escopo, exigeMulti) => {
    for (let i = 0; i + n <= seq.length; i++) {
      const jan = seq.slice(i, i + n);
      if (exigeMulti && new Set(jan.map(p => p.n)).size < 2) continue;
      if (teste(jan)) add(regra, jan, escopo);
    }
  };

  // Regras de sequência (2_2s, 4_1s, 10_x) — iguais dentro de um nível e entre níveis.
  const regrasDeSequencia = (seq, escopo, multi) => {
    janelas(seq, 2,  j => mesmoLado(j, 2), "2_2s", escopo, multi);
    janelas(seq, 4,  j => mesmoLado(j, 1), "4_1s", escopo, multi);
    janelas(seq, 10, j => mesmoLado(j, 0), "10_x", escopo, multi);
  };

  // ---- 1) DENTRO DE CADA NÍVEL (histórico do nível, ignorando dias sem resultado) ----
  z.forEach((serie, n) => {
    const seq = [];
    serie.forEach((v, d) => { if (v !== null) seq.push({ z: v, n, d }); });
    const esc = "mesmo nível (histórico)";
    seq.forEach(p => {
      if (Math.abs(p.z) > 3 && on("1_3s")) add("1_3s", [p], esc);
      else if (Math.abs(p.z) > 2) add("1_2s", [p], esc);       // 1_2s não repete o que a 1_3s já cobre (salvo se a 1_3s estiver desativada)
    });
    regrasDeSequencia(seq, esc, false);
    janelas(seq, 2, j => (j[0].z > 2 && j[1].z < -2) || (j[0].z < -2 && j[1].z > 2), "R_4s", esc, false);
    janelas(seq, 7, j => sobe(j) || desce(j), "7T", esc, false);   // tendência: 7 subindo ou 7 descendo
  });

  // ---- 2) ENTRE NÍVEIS ----
  // 2a) Sequência "pooled" em ordem cronológica (dia, depois nível): 2_2s, 4_1s e 10_x entre níveis.
  const pooled = [];
  const nDias = Math.max(0, ...z.map(s => s.length));
  for (let d = 0; d < nDias; d++) z.forEach((s, n) => { if (s[d] != null) pooled.push({ z: s[d], n, d }); });
  regrasDeSequencia(pooled, "entre níveis", true);
  // 2b) R_4s clássico: na MESMA corrida, um nível > +2 SD e outro < −2 SD.
  for (let d = 0; d < nDias; d++) {
    const dia = pooled.filter(p => p.d === d);
    const alto = dia.find(p => p.z > 2), baixo = dia.find(p => p.z < -2);
    if (alto && baixo) add("R_4s", [alto, baixo], "entre níveis (mesma corrida)");
  }

  // ---- 3) AGRUPA (mesma regra + mesmo dia = um alerta) ----
  const mapa = new Map();
  bruto.forEach(v => {
    const k = v.regra + "|" + v.dia;
    const m = mapa.get(k) || { regra: v.regra, dia: v.dia, erro: REGRAS_INFO[v.regra].erro, tipo: TIPO_ROTULO[cfg[v.regra]], pts: [], escopos: new Set() };
    v.pts.forEach(p => { if (!m.pts.some(q => q.n === p.n && q.d === p.d)) m.pts.push(p); });
    m.escopos.add(v.escopo);
    mapa.set(k, m);
  });
  const violacoes = [...mapa.values()].map(m => ({
    ...m, escopos: [...m.escopos],
    pts: m.pts.sort((a, b) => a.d - b.d || a.n - b.n),
    niveis: [...new Set(m.pts.map(p => p.n))].sort()
  })).sort((a, b) => b.dia - a.dia || (a.tipo === b.tipo ? 0 : a.tipo === "Rejeição" ? -1 : 1));

  const marcas = z.map(() => ({}));
  violacoes.forEach(v => v.pts.forEach(p => {
    const l = marcas[p.n][p.d] || (marcas[p.n][p.d] = []);
    if (!l.includes(v.regra)) l.push(v.regra);
  }));
  let ultimoDia = -1;
  z.forEach(s => s.forEach((v, d) => { if (v !== null && d > ultimoDia) ultimoDia = d; }));
  const tipos = {};   // tipos[regra] = "Alerta" | "Rejeição" (só regras ativas)
  Object.keys(cfg).forEach(r => { if (on(r)) tipos[r] = TIPO_ROTULO[cfg[r]]; });
  const assinatura = violacoes.map(v => v.regra + "/" + v.tipo + "@" + v.dia + ":" + v.pts.map(p => p.n + "." + p.d).join(",")).join(";");
  return { violacoes, marcas, ultimoDia, assinatura, tipos };
}

/* Conduta por SEVERIDADE (como o laboratório configurou a regra). Texto educacional. */
const CONDUTA_SEVERIDADE = {
  "Rejeição": { titulo: "Conduta (rejeição)", itens: [

  const opcoes = [[3, "3 SD (padrão)", "Linhas até ±3 SD: limite clássico de rejeição."], [2, "2 SD", "Linhas até ±2 SD: eixo mais ajustado aos dados."]];

    <fieldset>
      <legend className="sr-only">Limite do gráfico, em desvios-padrão</legend>
      <div className="grid gap-3 sm:grid-cols-2">
        ${opcoes.map(([v, rotulo, desc]) => html`<label key=${v} className=${"mb-0 flex cursor-pointer items-start gap-3 rounded-lg border p-3 " + (limiteSD === v ? "border-emerald-600 bg-emerald-50" : "border-slate-200 bg-slate-50 hover:border-slate-300")}>
          <input type="radio" name="limite-sd" value=${v} checked=${limiteSD === v} onChange=${() => setLimiteSD(v)} className="mt-1 h-4 w-4 accent-emerald-700" />
          <span><span className="block font-semibold text-slate-900">${rotulo}</span><span className="block text-sm font-normal text-slate-600">${desc}</span></span>
        </label>`)}

    </fieldset>
    <p className="dica">Vale para o gráfico de Levey-Jennings e para o gráfico Z-Score (linhas de referência e escala do eixo Y). Se algum resultado passar do limite escolhido, o eixo cresce para ele continuar visível. As regras de Westgard não mudam com esta opção.</p>

}

                   <${Campo} id=${"sd-" + i} rotulo="SD esperado" valor=${n.sd} onChange=${v => mudarNivel(i, "sd", v)} dica="Ex.: 4" />`

                   <${Campo} id=${"max-" + i} rotulo="Limite superior" valor=${n.max} onChange=${v => mudarNivel(i, "max", v)} dica="Ex.: 108" />
                   <div>
                     <label htmlFor=${"k-" + i}>O intervalo equivale a</label>
                     <select id=${"k-" + i} value=${n.k} onChange=${e => mudarNivel(i, "k", e.target.value)}>

        <p className=${p ? "dica" : "erro"}>

/* Gráfico de Levey-Jennings de UM nível.
   As linhas de referência vêm do Alvo e SD ESPERADOS (configuração), não dos pontos digitados. */
function GraficoNivel({ corridas, idx, alvo, sd, aval, limiteSD = 3 }) {
  const canvasRef = useRef(null);
  const chartOk = typeof Chart !== "undefined";

  useEffect(() => {
    if (!chartOk) return;
    const valores = corridas.map(r => r[idx]);                 // pode conter null (dia sem esse nível)
    const limites = calcularLimites(alvo, sd).filter(l => Math.abs(l.k) <= limiteSD);   // FIXOS: alvo ± k × SD esperado, só até o limite escolhido (2 ou 3)
    const dias = Math.max(valores.length, DIAS_MINIMOS);
    const rotulos = Array.from({ length: dias }, (_, i) => "Dia " + (i + 1));

    const serieResultados = {
      label: "Resultados", data: valores, spanGaps: false,
      borderColor: "#1d2420", backgroundColor: "#1d2420",
      ...estiloPontos(aval, idx, valores.length, "#1d2420"),      // pontos que violam regras ficam vermelhos/laranja
      borderWidth: 2, pointHoverRadius: 6, tension: 0, order: 0
    };
    const seriesLimites = limites.map(({ k, valor }) => {
      const e = ESTILO_LINHAS[Math.abs(k)];
      return {
        label: e.nome, data: rotulos.map(() => valor),
        borderColor: e.cor, borderWidth: e.largura, borderDash: e.tracejado,
        pointRadius: 0, pointHitRadius: 0, tension: 0, order: 1,
        esconderNaLegenda: k < 0,
        rotuloFim: k === 0 ? "Alvo" : (k > 0 ? "+" : "−") + Math.abs(k) + " SD"
      };
    });

    // Eixo Y: cobre as linhas exibidas (±limite escolhido) e também qualquer resultado fora delas.
    const todos = [...valores.filter(v => v !== null), ...limites.map(l => l.valor)];
    const minimo = Math.min(...todos), maximo = Math.max(...todos);
    const folga = (maximo - minimo) * 0.08;

    const grafico = new Chart(canvasRef.current, {
      type: "line",
      data: { labels: rotulos, datasets: [serieResultados, ...seriesLimites] },
      plugins: [pluginRotulosLinhas, pluginRotulosViolacao],
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: "nearest", intersect: true },
        layout: { padding: { right: 52, top: 16 } },
        scales: {
          x: { title: { display: true, text: "Corrida / dia" }, grid: { display: false } },
          y: { min: minimo - folga, max: maximo + folga, title: { display: true, text: "Resultado do controle" }, ticks: { callback: v => fmtNum(v, 1) } }
        },
        plugins: {
          legend: { position: "bottom", labels: { filter: (item, dados) => !dados.datasets[item.datasetIndex].esconderNaLegenda } },
          tooltip: { filter: item => item.datasetIndex === 0, callbacks: { label: c => "Resultado: " + fmtNum(c.parsed.y, 3) } }
        }
      }
    });
    return () => grafico.destroy();
  }, [corridas, idx, alvo, sd, aval.assinatura, limiteSD]);

  if (!chartOk) return html`<p className="erro">${MSG_SEM_GRAFICO}</p>`;
  return html`<div className="caixa-grafico">
    <canvas ref=${canvasRef} role="img" aria-label=${"Gráfico de Levey-Jennings do Nível " + (idx + 1) + ", alvo " + fmtNum(alvo, 2) + " e SD esperado " + fmtNum(sd, 3) + "."}></canvas>
  </div>`;
}

const MSG_SEM_GRAFICO = "Não foi possível carregar a biblioteca de gráficos (Chart.js). Verifique a conexão com a internet e recarregue a página. As estatísticas continuam funcionando.";
const COR_NIVEIS = ["#1f5fa8", "#2f8f5b", "#7b3fa0"];   // Nível 1 azul, Nível 2 verde, Nível 3 roxo

/* =====================================================================
   ███ COMPONENTES VISUAIS (React) — usam o Motor de Regras acima ███
   ===================================================================== */
const COR_REJEICAO = "#b3261e", COR_ALERTA = "#c77700";

/* "1_3s" → 1<sub>3s</sub>;  "7T" → 7T */
function rotuloHtml(regra) {
  const m = regra.match(/^(.+?)_(.+)$/);
  return m ? html`${m[1]}<sub>${m[2]}</sub>` : regra;
}

/* Estilo dos pontos do gráfico: vermelho = rejeição, laranja = alerta, + rótulo da regra acima do ponto. */
function estiloPontos(aval, nivel, n, corBase) {
  const m = (aval && aval.marcas[nivel]) || {};
  const d = Array.from({ length: n }, (_, i) => i);
  const cor = i => !m[i] ? corBase : m[i].some(r => aval.tipos[r] === "Rejeição") ? COR_REJEICAO : COR_ALERTA;
  return {
    pointBackgroundColor: d.map(cor), pointBorderColor: d.map(cor),
    pointRadius: d.map(i => (m[i] ? 7 : 4)),
    rotulosPontos: d.map(i => (m[i] ? m[i].map(rotuloTxt).join(" ") : "")), corRotulos: d.map(cor)
  };
}

// Plugin do Chart.js: escreve a(s) regra(s) violada(s) acima do ponto.
const pluginRotulosViolacao = {
  id: "rotulosViolacao",
  afterDatasetsDraw(g) {
    g.data.datasets.forEach((s, i) => {
      if (!s.rotulosPontos) return;
      g.getDatasetMeta(i).data.forEach((pt, d) => {
        if (!s.rotulosPontos[d]) return;
        g.ctx.save(); g.ctx.fillStyle = s.corRotulos[d]; g.ctx.font = "bold 12px system-ui, sans-serif";
        g.ctx.textAlign = "center"; g.ctx.fillText(s.rotulosPontos[d], pt.x, pt.y - 12); g.ctx.restore();
      });
    });
  }
};

/* Painel de configuração: severidade de cada regra (Desativada / Alerta / Rejeição). */
const COR_SEV = { off: "#8a948e", alerta: "#c77700", rejeicao: "#b3261e" };
const DESCR_REGRAS = { "1_2s": "1 resultado além de ±2 SD", "1_3s": "1 resultado além de ±3 SD", "2_2s": "2 seguidos além de 2 SD, mesmo lado", "R_4s": "um > +2 SD e outro < −2 SD", "4_1s": "4 seguidos além de 1 SD, mesmo lado", "10_x": "10 seguidos do mesmo lado da média", "7T": "7 seguidos subindo ou descendo" };

    <div className="regras-cfg">

        <select id=${"sev-" + r} value=${regrasCfg[r]} onChange=${e => { const v = e.target.value; setRegrasCfg(c => ({ ...c, [r]: v })); }}>
          <option value="off">Desativada</option>
          <option value="alerta">Alerta (Warning)</option>
          <option value="rejeicao">Rejeição (Rejection)</option>
        </select>
      </div>`)}
    </div>
    ${regrasCfg["1_2s"] === "rejeicao" && html`<p className="dica">Atenção: usar 1<sub>2s</sub> como rejeição gera muitos falsos alarmes (cerca de 5% dos resultados em um sistema estável).</p>`}
    ${nenhuma && html`<p className="erro">Todas as regras estão desativadas: o sistema não detectará violações.</p>`}
    <div className="linha" style=${{ marginTop: "12px" }}>
      <button type="button" className="secundario" disabled=${padrao} onClick=${() => setRegrasCfg({ ...CFG_PADRAO })}>Restaurar padrão clássico</button>
    </div>
  </section>`;

/* Painel "Alertas do Sistema": decisão da última corrida + lista de violações com condutas. */
function AlertasSistema({ aval }) {
  const { violacoes, ultimoDia } = aval;
  const daUltima = violacoes.filter(v => v.dia === ultimoDia);
  const nomes = daUltima.map(v => rotuloTxt(v.regra)).join(", ");
  const dia = ultimoDia + 1;
  let banner = null;
  if (ultimoDia >= 0) {
    if (daUltima.some(v => v.tipo === "Rejeição"))
      banner = ["rej", "Dia " + dia + ": REJEIÇÃO (" + nomes + "). Bloquear a liberação, investigar a causa, corrigir e repetir os controles."];
    else if (daUltima.length)
      banner = ["alerta", "Dia " + dia + ": ALERTA (" + nomes + "). Investigar tendência, registrar a ocorrência e verificar manutenções. A corrida pode ser liberada com cautela, conforme o POP."];
    else
      banner = ["ok", "Dia " + dia + ": nenhuma regra violada na última corrida." + (violacoes.length ? " Há ocorrências anteriores abaixo." : "")];
  }
  const nivelTxt = v => (v.niveis.length > 1 ? "Níveis " + v.niveis.map(n => n + 1).join(" e ") : "Nível " + (v.niveis[0] + 1));
  const ponto = p => "N" + (p.n + 1) + "·Dia " + (p.d + 1);
  const pontos = v => (v.pts.length > 6 ? ponto(v.pts[0]) + " … " + ponto(v.pts[v.pts.length - 1]) : v.pts.map(ponto).join(", "));
  const lista = (itens) => html`<ul className="mt-1 list-disc space-y-1 pl-5 text-sm text-slate-700">${itens.map((c, i) => html`<li key=${i}>${c}</li>`)}</ul>`;

  return html`<section className="painel" aria-labelledby="t-alertas">
    <h2 id="t-alertas">Alertas do Sistema</h2>
    <div aria-live="polite">
      ${banner ? html`<div className=${"banner " + banner[0]}>${banner[1]}</div>`
               : html`<p className="vazio">Insira resultados para o sistema avaliar as regras de Westgard.</p>`}
      ${ultimoDia >= 0 && violacoes.length === 0 && html`<p className="vazio">Nenhuma violação detectada em todo o histórico.</p>`}
    </div>
    <div className="max-h-[640px] space-y-3 overflow-y-auto pr-1">
      ${violacoes.map(v => {
        const rej = v.tipo === "Rejeição", c = CONDUTA_SEVERIDADE[v.tipo];
        /* CARD DE NOTIFICAÇÃO: vermelho = rejeição, âmbar = alerta */
        return html`<article key=${v.regra + v.dia} className=${"flex gap-3 rounded-xl border-l-4 p-4 shadow-md " + (rej ? "border-red-500 bg-red-50" : "border-amber-400 bg-amber-50")}>
          <div aria-hidden="true" className=${"flex h-9 w-9 shrink-0 items-center justify-center rounded-full font-bold text-white " + (rej ? "bg-red-600" : "bg-amber-500")}>${rej ? "✕" : "!"}</div>
          <div className="min-w-0 flex-1">
            <div className="flex flex-wrap items-center gap-2">
              <span className=${"text-lg font-bold " + (rej ? "text-red-800" : "text-amber-800")}>${rotuloHtml(v.regra)}</span>
              <span className=${"selo " + (rej ? "rejeicao" : "alerta")}>${v.tipo}</span>
              <span className="selo neutro">Erro ${v.erro.toLowerCase()}</span>
              <span className="ml-auto text-sm font-medium text-slate-600">Dia ${v.dia + 1} · ${nivelTxt(v)}</span>
            </div>
            <p className=${"mt-1 text-sm font-semibold " + (rej ? "text-red-800" : "text-amber-800")}>${rej ? "Bloquear a liberação, investigar a causa, corrigir e repetir os controles." : "Investigar a tendência e registrar a ocorrência; liberação com cautela, conforme o POP."}</p>
            <p className="mt-1 text-xs text-slate-500">${v.escopos.join(" e ")}. Pontos: ${pontos(v)}.</p>
            <details className="mt-2" open=${v.dia === ultimoDia}>
              <summary className="cursor-pointer text-sm font-semibold text-slate-700 hover:text-slate-900">Conduta e onde investigar</summary>
              <div className="mt-2 grid gap-4 md:grid-cols-2">
                <div><h4 className="text-xs font-bold uppercase tracking-wide text-slate-500">${c.titulo}</h4>${lista(c.itens)}</div>
                <div><h4 className="text-xs font-bold uppercase tracking-wide text-slate-500">Onde investigar (erro ${v.erro.toLowerCase()})</h4>${lista(CAUSAS[v.regra])}</div>
              </div>
            </details>
          </div>
        </article>`;
      })}
    </div>
    <p className="dica">Simulação educacional: as condutas são sugestões gerais; a decisão real segue os procedimentos do laboratório.</p>
  </section>`;
}

/* Mini-gráfico SVG do exercício. As violações só são destacadas depois que o aluno responde ("revelar"). */
function GraficoExercicio({ niveis, aval, revelar }) {
  const W = 360, H = 200, n = niveis[0].length;
  const y = z => 100 - z * 27, x = i => 34 + i * (W - 50) / (n - 1);
  const refs = [[3, COR_REJEICAO, ""], [2, COR_ALERTA, "6 4"], [1, "#8a948e", "2 4"], [0, "#4a524d", ""], [-1, "#8a948e", "2 4"], [-2, COR_ALERTA, "6 4"], [-3, COR_REJEICAO, ""]];
  return html`<svg className="mini grande" viewBox=${"0 0 " + W + " " + H} role="img" aria-label=${"Gráfico de Levey-Jennings em Z-Score com " + niveis.length + " nível(is) e " + n + " dias."}>
    ${refs.map(([z, cor, tr]) => html`<g key=${z}>
      <line x1="30" x2=${W - 6} y1=${y(z)} y2=${y(z)} stroke=${cor} strokeWidth="1" strokeDasharray=${tr || undefined} />
      <text x="2" y=${y(z) + 3}>${(z > 0 ? "+" : z < 0 ? "−" : "") + Math.abs(z)}</text></g>`)}
    ${Array.from({ length: n }, (_, i) => html`<text key=${i} x=${x(i) - 8} y=${H - 6}>D${i + 1}</text>`)}
    ${niveis.map((s, k) => html`<g key=${k}>
      <polyline fill="none" stroke=${COR_NIVEIS[k]} strokeWidth="1.5" points=${s.map((z, i) => x(i) + "," + y(z)).join(" ")} />
      ${s.map((z, i) => {
        const m = revelar && aval.marcas[k][i];
        const cor = !m ? COR_NIVEIS[k] : m.some(r => aval.tipos[r] === "Rejeição") ? COR_REJEICAO : COR_ALERTA;
        return html`<g key=${i}><circle cx=${x(i)} cy=${y(z)} r=${m ? 6 : 3.5} fill=${cor} />
          ${m && html`<text x=${x(i)} y=${y(z) - 10} textAnchor="middle" style=${{ fill: cor, fontWeight: 700, fontSize: "11px" }}>${m.map(rotuloTxt).join(" ")}</text>`}</g>`;
      })}</g>`)}
  </svg>`;
}

/* ---------------- Modo Treinamento: lê o banco estático window.bancoDeExercicios (exercicios.js) ---------------- */
const BADGE_DIFICULDADE = { "Básico": "bg-emerald-100 text-emerald-800", "Intermediário": "bg-sky-100 text-sky-800", "Avançado": "bg-violet-100 text-violet-800" };
const fmtRes = v => v.toLocaleString("pt-BR", { maximumFractionDigits: 3 });

/* Lê e valida o banco. Um exercício com formato inválido é ignorado (aviso no console) e nunca derruba o app. */
function carregarExercicios() {
  const banco = Array.isArray(window.bancoDeExercicios) ? window.bancoDeExercicios : [];
  const ids = new Set();
  return banco.filter(ex => {
    const g = ex && ex.grafico;
    const grafico = !g || (Array.isArray(g.niveis) && g.niveis.length >= 1 && g.niveis.length <= 3 && g.niveis.every(n =>
      n && n.sd > 0 && Number.isFinite(n.alvo) && Array.isArray(n.resultados) && n.resultados.length >= 2
      && n.resultados.length === g.niveis[0].resultados.length && n.resultados.every(v => Number.isFinite(v))));
    const ok = ex && ex.id && !ids.has(ex.id) && ex.titulo && ex.pergunta && Array.isArray(ex.alternativas)
      && ex.alternativas.length >= 2 && ex.alternativas.some(a => a.id === ex.respostaCorreta) && grafico;
    if (!ok) console.warn("[QualiLab] Exercício ignorado (formato inválido ou id repetido):", ex && ex.id);
    else ids.add(ex.id);
    return !!ok;
  });
}

/* Um exercício aberto: cenário, gráfico (se houver), alternativas e feedback. */
function ExercicioAberto({ ex, escolha, onResponder, onRefazer, onVoltar, onProximo }) {
  const g = ex.grafico;
  const z = g ? g.niveis.map(n => n.resultados.map(v => calcularZScore(v, n.alvo, n.sd))) : null;
  const aval = z ? avaliarRegras(z, { ...CFG_PADRAO, ...(ex.configRegras || {}) }) : null;   // Motor de Regras sobre os dados do exercício
  const respondeu = escolha !== undefined;
  const acertou = respondeu && escolha === ex.respostaCorreta;
  const letra = id => String.fromCharCode(65 + ex.alternativas.findIndex(a => a.id === id));
  const certa = ex.alternativas.find(a => a.id === ex.respostaCorreta);
  const marcada = ex.alternativas.find(a => a.id === escolha);
  const detectadas = aval ? aval.violacoes.slice().sort((a, b) => a.dia - b.dia) : [];

  return html`<section className="painel" aria-labelledby="t-ex">
    <button type="button" className="secundario mb-4" onClick=${onVoltar}>← Voltar à lista</button>
    <div className="flex flex-wrap items-center gap-2"><span className=${"selo " + (BADGE_DIFICULDADE[ex.dificuldade] || "neutro")}>${ex.dificuldade || "Exercício"}</span></div>
    <h2 id="t-ex" className="mt-2">${ex.titulo}</h2>
    ${ex.cenario && html`<p className="text-sm leading-relaxed text-slate-700">${ex.cenario}</p>`}
    ${g && html`<div className="mt-4 grid items-start gap-4 lg:grid-cols-2">
      <div>
        <${GraficoExercicio} niveis=${z} aval=${aval} revelar=${respondeu} />
        <p className="leg dica">${g.niveis.map((n, k) => html`<span key=${k}><i style=${{ background: COR_NIVEIS[k] }}></i>${n.nome}</span>`)}</p>
      </div>
      <div>
        <p className="dica" style=${{ marginTop: 0 }}>${g.analito}${g.unidade ? " (" + g.unidade + ")" : ""} · ${g.niveis.map(n => n.nome + ": alvo " + fmtRes(n.alvo) + ", SD " + fmtRes(n.sd)).join(" | ")}</p>
        <div className="lista"><table>
          <thead><tr><th>Dia</th>${g.niveis.map((n, k) => html`<th key=${k} className="num">${n.nome}</th>`)}</tr></thead>
          <tbody>${g.niveis[0].resultados.map((_, d) => html`<tr key=${d}><td>Dia ${d + 1}</td>${g.niveis.map((n, k) => html`<td key=${k} className="num">${fmtRes(n.resultados[d])}</td>`)}</tr>`)}</tbody>
        </table></div>
      </div>
    </div>`}
    <h3 className="mt-5 text-base">${ex.pergunta}</h3>
    <div className="opcoes" role="group" aria-label="Alternativas">
      ${ex.alternativas.map((a, k) => html`<button key=${a.id} type="button" disabled=${respondeu && a.id !== escolha && a.id !== ex.respostaCorreta}
        className=${"opcao" + (respondeu && a.id === ex.respostaCorreta ? " certa" : respondeu && a.id === escolha ? " errada" : "")}
        onClick=${() => !respondeu && onResponder(a.id)}>${String.fromCharCode(65 + k)}) ${a.texto}</button>`)}
    </div>
    ${respondeu && html`<div className=${"feedback " + (acertou ? "certo" : "errado")} role="status">
      <h3>${acertou ? "Correto!" : "Incorreto."}</h3>
      ${!acertou && html`<p><strong>Resposta correta:</strong> ${letra(certa.id)}) ${certa.texto}</p>`}
      ${!acertou && marcada && marcada.comentario && html`<p><strong>Sobre a alternativa escolhida:</strong> ${marcada.comentario}</p>`}
      <p><strong>Justificativa técnica:</strong> ${ex.justificativa}</p>
      ${aval && html`<p><strong>O Motor de Regras detectou neste gráfico:</strong> ${detectadas.length ? detectadas.map(v => rotuloTxt(v.regra) + " (" + v.tipo.toLowerCase() + ", Dia " + (v.dia + 1) + ")").join("; ") : "nenhuma violação"}.</p>`}
      <div className="linha mt-3">
        ${onProximo && html`<button type="button" className="primario" onClick=${onProximo}>Próximo exercício</button>`}
        <button type="button" className=${onProximo ? "secundario" : "primario"} onClick=${onVoltar}>Voltar à lista</button>
        <button type="button" className="secundario" onClick=${onRefazer}>Refazer</button>
      </div>
    </div>`}
  </section>`;
}

const NIVEIS_TREINO = ["Básico", "Intermediário", "Avançado"];

function Treinamento() {
  const exercicios = React.useMemo(carregarExercicios, []);   // lê e valida window.bancoDeExercicios
  const [respostas, setRespostas] = useEstadoPersistente("respostas", {}, c => (c && typeof c === "object" && !Array.isArray(c) ? c : {}));   // { idExercicio: idAlternativa }
  const [abaAtiva, setAbaAtiva] = useEstadoPersistente("abaTreino", NIVEIS_TREINO[0], saneEm(NIVEIS_TREINO));   // lembra a aba ao recarregar
  const [abertoId, setAbertoId] = useState(null);

  if (exercicios.length === 0) return html`<section className="painel" aria-labelledby="t-ex">
    <h2 id="t-ex">Modo Treinamento</h2>
    <p className="erro">Nenhum exercício disponível. Verifique se o arquivo <strong>exercicios.js</strong> está na mesma pasta do index.html e é carregado antes do script principal.</p>
  </section>`;

  // Contadores dinâmicos: filtram o banco por dificuldade (ex.: "Básico (10)").
  const porNivel = Object.fromEntries(NIVEIS_TREINO.map(n => [n, exercicios.filter(e => e.dificuldade === n)]));

  // ---- Exercício aberto: "Próximo" avança dentro da MESMA dificuldade ----
  const aberto = exercicios.find(e => e.id === abertoId);
  if (aberto) {
    const grupo = porNivel[aberto.dificuldade] || exercicios;
    const proximo = grupo[grupo.findIndex(e => e.id === aberto.id) + 1];
    return html`<${ExercicioAberto} key=${aberto.id} ex=${aberto} escolha=${respostas[aberto.id]}
      onResponder=${alt => setRespostas(r => ({ ...r, [aberto.id]: alt }))}
      onRefazer=${() => setRespostas(r => { const c = { ...r }; delete c[aberto.id]; return c; })}
      onVoltar=${() => setAbertoId(null)}
      onProximo=${proximo ? () => setAbertoId(proximo.id) : null} />`;
  }

  // ---- Lista da aba ativa ----
  const lista = porNivel[abaAtiva];
  const feitos = lista.filter(e => respostas[e.id] !== undefined);
  const acertos = feitos.filter(e => respostas[e.id] === e.respostaCorreta).length;

  // Setas ← → trocam de aba (padrão de acessibilidade para tablist).
  const teclas = (e, i) => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    e.preventDefault();
    const novo = NIVEIS_TREINO[(i + (e.key === "ArrowRight" ? 1 : NIVEIS_TREINO.length - 1)) % NIVEIS_TREINO.length];
    setAbaAtiva(novo);
    const el = document.getElementById("aba-" + novo);
    if (el) el.focus();
  };

  const zerarAba = () => {
    if (!window.confirm("Zerar o progresso dos exercícios do nível " + abaAtiva + "?")) return;
    setRespostas(r => { const c = { ...r }; lista.forEach(e => delete c[e.id]); return c; });
  };

  return html`<section className="painel" aria-labelledby="t-ex">
    <h2 id="t-ex">Exercícios</h2>

    <div role="tablist" aria-label="Dificuldade dos exercícios" className="mb-4 flex gap-1 overflow-x-auto border-b border-slate-200">
      ${NIVEIS_TREINO.map((n, i) => {
        const ativa = n === abaAtiva;
        return html`<button key=${n} id=${"aba-" + n} type="button" role="tab" aria-selected=${ativa} aria-controls="painel-treino"
          tabIndex=${ativa ? 0 : -1} onClick=${() => setAbaAtiva(n)} onKeyDown=${e => teclas(e, i)}
          className=${"-mb-px whitespace-nowrap rounded-none rounded-t-lg border-b-4 px-4 " + (ativa
            ? "border-emerald-600 bg-emerald-50 text-emerald-800"
            : "border-transparent text-slate-500 hover:bg-slate-50 hover:text-slate-800")}>
          ${n} (${porNivel[n].length})</button>`;
      })}
    </div>

    <div id="painel-treino" role="tabpanel" aria-labelledby=${"aba-" + abaAtiva}>
      <div className="mb-4 flex flex-wrap items-center justify-between gap-3">
        <p className="dica" style=${{ marginTop: 0 }}>${feitos.length} de ${lista.length} respondidos · ${acertos} ${acertos === 1 ? "acerto" : "acertos"}</p>
        <button type="button" className="secundario" disabled=${feitos.length === 0} onClick=${zerarAba}>Zerar progresso desta aba</button>
      </div>

      ${lista.length === 0
        ? html`<p className="vazio">Nenhum exercício de nível ${abaAtiva} no momento.</p>`
        : html`<div className="grid gap-4 md:grid-cols-2">
          ${lista.map(ex => {
            const r = respostas[ex.id], feito = r !== undefined, certo = r === ex.respostaCorreta;
            return html`<article key=${ex.id} className="flex flex-col rounded-xl border border-slate-200 bg-white p-4 shadow-md">
              <div className="flex flex-wrap items-center gap-2">
                <span className=${"selo " + (BADGE_DIFICULDADE[ex.dificuldade] || "neutro")}>${ex.dificuldade}</span>
                <span className="selo bg-slate-100 text-slate-600">${ex.grafico ? "Com gráfico" : "Teórico"}</span>
                ${feito && html`<span className=${"selo " + (certo ? "neutro" : "rejeicao")}>${certo ? "✓ Acertou" : "✕ Errou"}</span>`}
              </div>
              <h3 className="mt-2 text-base text-slate-900">${ex.titulo}</h3>
              ${ex.cenario && html`<p className="mt-1 line-clamp-3 text-sm text-slate-600">${ex.cenario}</p>`}
              <div className="mt-auto pt-3"><button type="button" className="primario" onClick=${() => setAbertoId(ex.id)}>${feito ? "Rever exercício" : "Resolver"}</button></div>
            </article>`;
          })}
        </div>`}
    </div>
  </section>`;
}

/* Gráfico combinado: todos os níveis ativos convertidos em Z-Score, no mesmo eixo (−3 a +3). */
function GraficoZScore({ corridas, parametros, aval, limiteSD = 3 }) {
  const canvasRef = useRef(null);
  // "chave" muda só quando alvo/SD mudam. Evita redesenhar o gráfico a cada tecla digitada.
  const chave = parametros.map(p => (p ? p.alvo + "/" + p.sd : "x")).join("|");
  const algumValido = parametros.some(p => p !== null);
  const chartOk = typeof Chart !== "undefined";

  useEffect(() => {
    if (!canvasRef.current) return;
    const rotulos = Array.from({ length: Math.max(corridas.length, DIAS_MINIMOS) }, (_, i) => "Dia " + (i + 1));
    let zExtremo = limiteSD;   // eixo Y = ±limite escolhido (2 ou 3); só cresce se algum ponto passar dele, para não esconder dados

    const seriesNiveis = [];
    parametros.forEach((p, i) => {
      if (!p) return;                                        // nível sem configuração válida não entra
      const brutos = corridas.map(r => r[i]);                // valores originais (para o tooltip)
      const zs = brutos.map(v => calcularZScore(v, p.alvo, p.sd));
      zs.forEach(z => { if (z !== null) zExtremo = Math.max(zExtremo, Math.ceil(Math.abs(z))); });
      seriesNiveis.push({
        label: "Nível " + (i + 1), data: zs, brutos, ehNivel: true, spanGaps: false,
        borderColor: COR_NIVEIS[i], backgroundColor: COR_NIVEIS[i],
        ...estiloPontos(aval, i, corridas.length, COR_NIVEIS[i]),
        borderWidth: 2, pointHoverRadius: 6, tension: 0, order: 0
      });
    });

    // Referências em Z fixo: 0, ±1, ±2, ±3 (a linha 0 é neutra para não confundir com o Nível 2 verde).
    const seriesRef = [3, 2, 1, 0, -1, -2, -3].filter(k => Math.abs(k) <= limiteSD).map(k => {
      const e = ESTILO_LINHAS[Math.abs(k)];
      return {
        label: e.nome === "Média" ? "Alvo (Z = 0)" : e.nome, data: rotulos.map(() => k),
        borderColor: k === 0 ? "#4a524d" : e.cor, borderWidth: e.largura, borderDash: e.tracejado,
        pointRadius: 0, pointHitRadius: 0, tension: 0, order: 1,
        esconderNaLegenda: k < 0,
        rotuloFim: k === 0 ? "0" : (k > 0 ? "+" : "−") + Math.abs(k)
      };
    });

    const grafico = new Chart(canvasRef.current, {
      type: "line",
      data: { labels: rotulos, datasets: [...seriesNiveis, ...seriesRef] },
      plugins: [pluginRotulosLinhas, pluginRotulosViolacao],
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: "nearest", intersect: true },
        layout: { padding: { right: 36, top: 16 } },
        scales: {
          x: { title: { display: true, text: "Corrida / dia" }, grid: { display: false } },
          y: { min: -zExtremo, max: zExtremo, title: { display: true, text: "Z-Score (SDI)" },
               ticks: { stepSize: 1, callback: v => (v > 0 ? "+" : "") + v } }
        },
        plugins: {
          legend: { position: "bottom", labels: { filter: (item, dados) => !dados.datasets[item.datasetIndex].esconderNaLegenda } },
          tooltip: {
            filter: item => item.dataset.ehNivel === true,
            callbacks: { label: c => c.dataset.label + ": Z = " + (c.parsed.y > 0 ? "+" : "") + fmtNum(c.parsed.y, 2) + " (valor " + fmtNum(c.dataset.brutos[c.dataIndex], 3) + ")" }
          }
        }
      }
    });
    return () => grafico.destroy();
  }, [corridas, chave, aval.assinatura, limiteSD]);

  return html`<div>
    ${!chartOk ? html`<p className="erro">${MSG_SEM_GRAFICO}</p>` : algumValido
      ? html`<div className="caixa-grafico"><canvas ref=${canvasRef} role="img" aria-label=${"Gráfico combinado em Z-Score com todos os níveis ativos, limites de menos " + limiteSD + " a mais " + limiteSD + " desvios-padrão."}></canvas></div>`
      : html`<p className="erro">Defina alvo e SD válidos em pelo menos um nível para ver o gráfico combinado.</p>`}
    <p className="dica">Z = (resultado − alvo) ÷ SD esperado. Z = 0 é o alvo e +2 é 2 SD acima dele. Cada nível usa o próprio alvo e SD da configuração, então níveis com escalas diferentes ficam comparáveis no mesmo eixo.</p>
  </div>`;
}

/* Mini-gráfico estático: pontos em Z-Score, linhas em 0, ±1, ±2 e ±3. Pontos vermelhos = violação. */
function MiniGrafico({ pontos, destaque, descricao }) {
  const W = 300, H = 120;
  const y = z => 60 - z * 16;                                    // Z (−3..+3) -> altura
  const x = i => 28 + i * (W - 40) / (pontos.length - 1);        // índice -> posição horizontal
  const refs = [[3, "#b3261e", ""], [2, "#c77700", "6 4"], [1, "#8a948e", "2 4"], [0, "#4a524d", ""], [-1, "#8a948e", "2 4"], [-2, "#c77700", "6 4"], [-3, "#b3261e", ""]];
  return html`<svg className="mini" viewBox=${"0 0 " + W + " " + H} role="img" aria-label=${descricao}>
    ${refs.map(([z, cor, tr]) => html`<g key=${z}>
      <line x1="28" x2=${W - 8} y1=${y(z)} y2=${y(z)} stroke=${cor} strokeWidth="1" strokeDasharray=${tr || undefined} />
      <text x="2" y=${y(z) + 3}>${(z > 0 ? "+" : z < 0 ? "−" : "") + Math.abs(z)}</text>
    </g>`)}
    <polyline fill="none" stroke="#1d2420" strokeWidth="1.5" points=${pontos.map((z, i) => x(i) + "," + y(z)).join(" ")} />
    ${pontos.map((z, i) => html`<circle key=${i} cx=${x(i)} cy=${y(z)} r=${destaque.includes(i) ? 5 : 3} fill=${destaque.includes(i) ? "#b3261e" : "#1d2420"} />`)}
  </svg>`;
}

function GuiaWestgard() {

    ["Sigma do método", "Medida do desempenho analítico: quanto maior, mais folga o método tem diante do erro permitido. Ajuda a planejar quais regras usar e como classificá-las (alerta ou rejeição)."]

    </p>

    <div className="guia-intro">
      <h3>O que são as regras de Westgard</h3>
      <p>A multirregra de Westgard é um conjunto de critérios aplicados aos resultados do controle interno para decidir se uma corrida analítica parece estar sob controle. Cada regra enxerga melhor um tipo de problema; usadas em conjunto, detectam mais erros com menos falsos alarmes do que uma regra isolada. Os limites são medidos em desvios-padrão (SD) a partir do alvo.</p>
      <h3>Erro aleatório e erro sistemático</h3>
      <p><strong>Erro aleatório</strong> é uma variação imprevisível, para cima ou para baixo, que aumenta a dispersão (imprecisão); costuma aparecer como pontos isolados muito afastados. <strong>Erro sistemático</strong> empurra os resultados sempre na mesma direção (viés); aparece como uma sequência de pontos do mesmo lado do alvo, um deslocamento ou uma tendência.</p>
      <h3>Como as regras são usadas em sequência</h3>
      <p>1) Compare cada resultado com os limites de ±2 e ±3 SD. 2) Se algum passar de 2 SD (1<sub>2s</sub>), trate como alerta e examine as demais regras. 3) Se uma regra de rejeição for violada, a corrida é considerada fora de controle e a causa deve ser investigada. Regras configuradas como alerta pedem investigação e registro, mas não bloqueiam a rotina por si só. 4) Registre a ocorrência e a ação tomada. Notação: o número antes indica quantos resultados entram na regra (1<sub>2s</sub> = um resultado além de 2 SD; 10<sub>x</sub> = dez resultados do mesmo lado da média; 7T = sete resultados consecutivos subindo ou descendo).</p>

      <p>As regras de um único ponto (1<sub>3s</sub>) e de poucos pontos (2<sub>2s</sub>, R<sub>4s</sub>) costumam ser tratadas como rejeição. Já as regras de <strong>longo prazo</strong> (4<sub>1s</sub>, 10<sub>x</sub>, 7T) enxergam deslocamentos e tendências que se formam ao longo de várias corridas, e a classificação delas não é universal. Em métodos com Sigma alto, que toleram pequenos desvios, o laboratório pode usá-las apenas como alerta, para investigar a tendência sem bloquear a rotina. Em métodos com Sigma baixo, que têm pouca margem de erro, elas tendem a ser usadas como rejeição. A decisão faz parte do planejamento da qualidade e deve estar descrita no POP.</p>

/* Gráfico + estatística real (dos pontos digitados) do nível ativo. */
function NivelPainel({ idx, parametros, corridas, aval, limiteSD = 3 }) {
  const serie = corridas.map(r => r[idx]).filter(v => v !== null);   // ignora dias sem esse nível
  const n = serie.length;
  const media = calcularMedia(serie);
  const sd = calcularDesvioPadrao(serie);
  const cv = calcularCV(sd, media);
  const vies = parametros ? calcularVies(media, parametros.alvo) : null;
  const cvEsperado = parametros ? calcularCV(parametros.sd, parametros.alvo) : null;
  const sinal = v => (v !== null && v > 0 ? "+" : "");

  const esperado = parametros ? [
    ["Alvo", formatar(parametros.alvo, 2)],
    ["SD esperado", formatar(parametros.sd, 3)],
    ["CV esperado", cvEsperado === null ? "—" : formatar(cvEsperado, 2) + "%"]
  ] : [];
  const obtido = [
    ["N", String(n)],
    ["Média obtida", formatar(media, 3)],
    ["SD obtido", formatar(sd, 3)],
    ["CV%", cv === null ? "—" : formatar(cv, 2) + "%"],
    ["Viés (média − alvo)", vies ? sinal(vies.absoluto) + formatar(vies.absoluto, 3) : "—"],
    ["Viés %", vies && vies.percentual !== null ? sinal(vies.percentual) + formatar(vies.percentual, 2) + "%" : "—"]
  ];

  return html`<div className="nivel-grid">
    <div>${parametros
      ? html`<${GraficoNivel} corridas=${corridas} idx=${idx} alvo=${parametros.alvo} sd=${parametros.sd} aval=${aval} limiteSD=${limiteSD} />`
      : html`<p className="erro">Defina alvo e SD válidos deste nível na configuração para ver o gráfico.</p>`}</div>
    <dl className="linhas-est" aria-live="polite">
      ${esperado.map(r => html`<div key=${r[0]} className="esp"><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`)}
      ${obtido.map(r => html`<div key=${r[0]}><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`)}
    </dl>
  </div>`;
}

/* =====================================================================
   ███ PERSISTÊNCIA (localStorage) ███
   Hook useState que lê o valor salvo ao iniciar e grava a cada mudança.
   Assim, ao atualizar a página (F5), configuração dos níveis, regras e
   resultados digitados continuam lá. Os dados lidos passam por "sanear",
   para que um valor antigo/corrompido nunca derrube o app.
   ===================================================================== */
const PREFIXO_LS = "qualilab:v1:";
function useEstadoPersistente(chave, inicial, sanear) {
  const [valor, setValor] = useState(() => {
    try {                                                    // LEITURA ao abrir a página
      const salvo = localStorage.getItem(PREFIXO_LS + chave);
      return salvo === null ? inicial : sanear(JSON.parse(salvo));
    } catch (e) { return inicial; }                          // localStorage bloqueado ou JSON inválido
  });
  useEffect(() => {
    try { localStorage.setItem(PREFIXO_LS + chave, JSON.stringify(valor)); }   // GRAVAÇÃO a cada mudança
    catch (e) { /* modo privado ou cota cheia: o app segue funcionando sem salvar */ }
  }, [chave, valor]);
  return [valor, setValor];
}

    <//>

    <${CapituloHistoria} id="h-saude" ano="Anos 1950" icone="frasco" titulo="A chegada à saúde: Levey e Jennings no laboratório clínico">
      <p>Em 1950, <strong>Stanley Levey</strong> e <strong>E. R. Jennings</strong> publicaram no <em>American Journal of Clinical Pathology</em> a adaptação dos gráficos de Shewhart para o laboratório clínico. Até então, a confiança nos resultados de sangue e outros fluidos dependia sobretudo da experiência do analista; agora era possível acompanhar de forma objetiva, ao longo dos dias, a <strong>precisão</strong> (dispersão dos resultados) e a <strong>exatidão</strong> (proximidade do valor esperado).</p>
      <p>A rotina passou a incluir um material de controle analisado junto com as amostras e registrado em um gráfico com a média e os limites em desvios-padrão. Esse formato ficou conhecido como <strong>gráfico de Levey-Jennings</strong>, e as versões usadas hoje, com um resultado de controle por ponto, foram se consolidando nos anos seguintes.</p>
      <${Destaque} titulo="No QualiLab" icone="livro"><p>Cada gráfico do Painel de Controle é um Levey-Jennings: o alvo no centro, linhas de ±1, ±2 e ±3 SD e os resultados do controle ao longo dos dias. Mudanças de nível (viés) e aumento de dispersão aparecem visualmente.</p><//>
    <//>

    <${CapituloHistoria} id="h-westgard" ano="1981" icone="escudo" titulo="A revolução de James Westgard: as multirregras">
      <p>Com apenas um limite (por exemplo, ±2 SD), um laboratório que usa dois níveis de controle gera muitos <strong>falsos alarmes</strong>: cerca de 5% dos resultados de um método estável passam de 2 SD só por acaso. Usar apenas ±3 SD reduz os falsos alarmes, mas deixa passar erros menores. Em 1981, <strong>James O. Westgard</strong> e colaboradores publicaram na <em>Clinical Chemistry</em> o procedimento de <strong>multirregras</strong>, combinando critérios com sensibilidades diferentes.</p>
      <p>A ideia é simples: a regra <span className="whitespace-nowrap">${rotuloHtml("1_2s")}</span> funciona como <em>alerta</em> que manda inspecionar os dados; só então as regras de rejeição são verificadas. Cada uma enxerga melhor um tipo de erro:</p>
      <ul className="list-disc space-y-1 pl-5">
        <li><strong>${rotuloHtml("1_3s")}</strong> e <strong>${rotuloHtml("R_4s")}</strong>: sinalizam principalmente erro aleatório.</li>
        <li><strong>${rotuloHtml("2_2s")}</strong>, <strong>${rotuloHtml("4_1s")}</strong> e <strong>${rotuloHtml("10_x")}</strong>: sinalizam principalmente erro sistemático.</li>
      </ul>
      <p>O resultado é uma boa detecção de erros analíticos relevantes com poucas rejeições falsas. Regras complementares, como a tendência <strong>7T</strong> usada no simulador, vieram depois e são adotadas conforme o planejamento de cada laboratório.</p>
      <${Destaque} titulo="Dica de estudo" icone="alvo"><p>Abra o Guia de Regras de Westgard no Modo Treinamento e compare cada regra com o tipo de erro que ela detecta (aleatório × sistemático).</p><//>
    <//>

    <${CapituloHistoria} id="h-moderno" ano="Anos 2000 até hoje" icone="alvo" titulo="O controle de qualidade moderno: Sigma e gestão de risco">
      <p>Com o tempo, ficou claro que um pacote único de regras não serve para todos os métodos. Um método muito estável precisa de menos controle; um método com pouca margem de erro precisa de mais. Surgiu então o <strong>planejamento da qualidade</strong>: o laboratório define primeiro a qualidade necessária, expressa pelo <strong>erro total permitido (TEa)</strong>, e depois escolhe o controle adequado ao desempenho real do método.</p>
      <p>A ferramenta que une as duas coisas é a <strong>métrica Sigma</strong>, trazida do Six Sigma da indústria:</p>
      <div className="rounded-lg border border-slate-200 bg-slate-50 px-4 py-3 text-center font-semibold text-slate-900">Sigma = (TEa − |Viés|) ÷ CV <span className="block text-xs font-normal text-slate-500">(todos em %, na mesma unidade)</span></div>
      <p>Exemplo: com TEa de 10%, viés de 1% e CV de 2%, o Sigma é (10 − 1) ÷ 2 = 4,5. Quanto maior o Sigma, mais folga o método tem, e menos rigoroso precisa ser o esquema de controle; quanto menor, mais controle é necessário e menor é a tolerância a desvios.</p>
      <p>Em paralelo, as diretrizes do <strong>CLSI</strong>, como a C24 sobre controle estatístico da qualidade, e a ideia de gestão de risco passaram a orientar o laboratório a montar um <strong>plano de controle</strong> personalizado: quais regras usar, quantos níveis, com que frequência e o que fazer diante de cada sinal. É por isso que, no QualiLab, regras de longo prazo como ${rotuloHtml("4_1s")}, ${rotuloHtml("10_x")} e 7T podem ser configuradas como alerta ou rejeição.</p>
      <${Destaque} titulo="Em resumo" icone="escudo"><p>Shewhart ensinou a separar variação natural de erro; Levey e Jennings levaram isso ao laboratório; Westgard otimizou a decisão com as multirregras; e o planejamento baseado em Sigma e risco ajusta o controle à qualidade que cada exame realmente exige.</p><//>
    <//>

    <section className="painel" aria-labelledby="t-ref">
      <h2 id="t-ref">Para aprofundar</h2>
      <ul className="list-disc space-y-1 pl-5 text-sm text-slate-700">
        <li>Shewhart WA. <em>Economic Control of Quality of Manufactured Product</em>, 1931.</li>
        <li>Levey S, Jennings ER. The use of control charts in the clinical laboratory. <em>Am J Clin Pathol</em>, 1950.</li>
        <li>Westgard JO, Barry PL, Hunt MR, Groth T. A multi-rule Shewhart chart for quality control in clinical chemistry. <em>Clin Chem</em>, 1981.</li>
        <li>CLSI. <em>C24: Statistical Quality Control for Quantitative Measurement Procedures</em> (consulte a edição vigente).</li>
      </ul>
      <p className="dica">Texto educacional, resumido para fins didáticos. Consulte as fontes originais e os documentos vigentes para uso profissional.</p>
      <div className="linha mt-4">
        <button type="button" className="primario" onClick=${() => onIrPara("painel")}>Ver os gráficos no simulador</button>
        <button type="button" className="secundario" onClick=${() => onIrPara("treino")}>Praticar no Modo Treinamento</button>
      </div>
    </section>
  </div>`;
}
/* =====================================================================
   LabSim — Simulador de Plantão Laboratorial
   Lê os casos de window.cenariosPlantao (arquivo cenarios-plantao.js).
   Estado do jogo (não persiste): { caso, noId, kpis, hist, escolha }
   ===================================================================== */
function graficoValido(g) {
  return !!g && Array.isArray(g.niveis) && g.niveis.length >= 1 && g.niveis.length <= 3 && g.niveis.every(n =>
    n && n.sd > 0 && Number.isFinite(n.alvo) && Array.isArray(n.resultados) && n.resultados.length >= 2
    && n.resultados.length === g.niveis[0].resultados.length && n.resultados.every(v => Number.isFinite(v)));
}
function carregarCenarios() {
  const banco = Array.isArray(window.cenariosPlantao) ? window.cenariosPlantao : [];
  const ids = new Set();
  return banco.filter(c => {
    const nos = c && c.nos && typeof c.nos === "object" ? c.nos : null;
    const ok = nos && c.id && !ids.has(c.id) && c.titulo && c.descricao && nos[c.inicio] && Object.values(nos).every(n =>
      n && (n.fim ? ["seguro", "atencao", "falha"].includes(n.resultado)
        : n.titulo && Array.isArray(n.opcoes) && n.opcoes.length >= 2 && n.opcoes.every(o => o && o.texto && nos[o.proximo])));
    if (ok) Object.entries(nos).forEach(([id, n]) => { if (n.grafico && !graficoValido(n.grafico)) { console.warn("[QualiLab] Gráfico ignorado (formato inválido):", c.id, id); delete n.grafico; } });
    if (!ok) console.warn("[QualiLab] Caso de plantão ignorado (formato inválido ou id repetido):", c && c.id);
    else ids.add(c.id);
    return !!ok;
  });
}

const limitar = (v, min, max) => Math.max(min, Math.min(max, v));
function aplicarImpacto(k, imp) {
  const i = imp || {};
  return { atraso: Math.max(0, k.atraso + (i.atraso || 0)), qualidade: limitar(k.qualidade + (i.qualidade || 0), 0, 100), seguranca: limitar(k.seguranca + (i.seguranca || 0), 0, 100) };
}
const corNota = v => (v >= 70 ? "bg-emerald-500" : v >= 40 ? "bg-amber-500" : "bg-red-500");
const sinalNum = v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v);

/* Indicadores no topo do painel. */
function KpisPlantao({ kpis, limite }) {
  const pctAtraso = limitar((kpis.atraso / limite) * 100, 0, 100);
  const corAtraso = pctAtraso < 35 ? "bg-emerald-500" : pctAtraso < 70 ? "bg-amber-500" : "bg-red-500";
  const itens = [
    ["Tempo / Atraso", kpis.atraso + " min de atraso", pctAtraso, corAtraso],
    ["Qualidade / Conformidade", kpis.qualidade + " / 100", kpis.qualidade, corNota(kpis.qualidade)],
    ["Segurança do paciente", kpis.seguranca + " / 100", kpis.seguranca, corNota(kpis.seguranca)]
  ];
  return html`<div className="mb-5 grid gap-3 sm:grid-cols-3" aria-live="polite">
    ${itens.map(([nome, texto, pct, cor]) => html`<div key=${nome} className="rounded-xl border border-slate-200 bg-white p-4 shadow-md">
      <div className="text-xs font-semibold uppercase tracking-wide text-slate-500">${nome}</div>
      <div className="mt-1 text-lg font-bold tabular-nums text-slate-900">${texto}</div>
      <div className="mt-2 h-2 overflow-hidden rounded-full bg-slate-100" role="presentation"><div className=${"h-full rounded-full transition-all duration-500 " + cor} style=${{ width: pct + "%" }}></div></div>
    </div>`)}
  </div>`;
}

function ChipsImpacto({ impacto }) {
  const i = impacto || {};
  const itens = [["atraso", "Atraso", " min", true], ["qualidade", "Qualidade", "", false], ["seguranca", "Segurança", "", false]].filter(([k]) => i[k]);
  return html`<div className="mt-2 flex flex-wrap gap-2">${itens.map(([k, nome, un, ruimSobe]) => {
    const ruim = ruimSobe ? i[k] > 0 : i[k] < 0;
    return html`<span key=${k} className=${"selo " + (ruim ? "rejeicao" : "neutro")}>${nome} ${sinalNum(i[k])}${un}</span>`;
  })}</div>`;
}

function LabSim() {
  const casos = React.useMemo(carregarCenarios, []);
  const [jogo, setJogo] = useState(null);

  if (casos.length === 0) return html`<section className="painel" aria-labelledby="t-ls">
    <h2 id="t-ls">LabSim (Plantão)</h2>
    <p className="erro">Nenhum caso disponível. Verifique se o arquivo <strong>cenarios-plantao.js</strong> está na mesma pasta do index.html e é carregado antes do script principal.</p>
  </section>`;

  const iniciar = c => setJogo({ caso: c, noId: c.inicio, kpis: { atraso: 0, qualidade: 100, seguranca: 100, ...(c.kpisIniciais || {}) }, hist: [], escolha: null });

  // ---- Lista de casos ----
  if (!jogo) return html`<section className="painel" aria-labelledby="t-ls">
    <h2 id="t-ls">LabSim · Simulador de Plantão Laboratorial</h2>
    <p className="dica" style=${{ marginTop: 0 }}>Assuma o plantão, tome decisões em sequência e veja o impacto analítico e clínico de cada escolha. Ao final, você recebe um relatório do plantão.</p>
    <div className="mt-4 grid gap-4 md:grid-cols-2">
      ${casos.map(c => html`<article key=${c.id} className="flex flex-col rounded-xl border border-slate-200 bg-white p-4 shadow-md">
        <div className="flex flex-wrap items-center gap-2">
          ${c.setor && html`<span className="selo neutro">${c.setor}</span>`}
          ${c.dificuldade && html`<span className=${"selo " + (BADGE_DIFICULDADE[c.dificuldade] || "neutro")}>${c.dificuldade}</span>`}
        </div>
        <h3 className="mt-2 text-base text-slate-900">${c.titulo}</h3>
        <p className="mt-1 line-clamp-4 text-sm text-slate-600">${c.descricao}</p>
        <div className="mt-auto pt-3"><button type="button" className="primario" onClick=${() => iniciar(c)}>Iniciar plantão</button></div>
      </article>`)}
    </div>
  </section>`;

  const { caso, kpis, hist, escolha } = jogo;
  const no = caso.nos[jogo.noId];
  const limite = caso.limiteAtraso || 90;
  const sair = () => setJogo(null);
  const g = no.grafico;
  const z = g ? g.niveis.map(n => n.resultados.map(v => calcularZScore(v, n.alvo, n.sd))) : null;
  const aval = z ? avaliarRegras(z, { ...CFG_PADRAO, ...(caso.configRegras || {}) }) : null;
  const detectadas = aval ? aval.violacoes.slice().sort((a, b) => a.dia - b.dia) : [];

  const escolher = op => setJogo(j => ({ ...j, kpis: aplicarImpacto(j.kpis, op.impacto), escolha: op,
    hist: [...j.hist, { etapa: no.titulo, hora: no.hora, escolha: op.texto, feedback: op.feedback, impacto: op.impacto }] }));
  const continuar = () => setJogo(j => ({ ...j, noId: j.escolha.proximo, escolha: null }));

  // ---- Relatório final ----
  if (no.fim) {
    const cls = { seguro: "ok", atencao: "alerta", falha: "rej" }[no.resultado];
    return html`<div>
      <${KpisPlantao} kpis=${kpis} limite=${limite} />
      <section className="painel" aria-labelledby="t-rel">
        <h2 id="t-rel">Relatório do plantão</h2>
        <div className=${"banner " + cls} role="status">${no.titulo}</div>
        <p className="text-[15px] leading-relaxed text-slate-700">${no.texto}</p>
        ${no.licao && html`<aside className="mt-3 rounded-lg border-l-4 border-emerald-600 bg-emerald-50 px-4 py-3 text-sm text-emerald-950 ring-1 ring-emerald-100"><strong>Lição principal:</strong> ${no.licao}</aside>`}
        <h3 className="titulo-tabela">Revisão das suas decisões</h3>
        <ol className="space-y-3">${hist.map((h, i) => html`<li key=${i} className="rounded-lg border border-slate-200 bg-slate-50 p-3 text-sm">
          <div className="text-xs font-semibold uppercase tracking-wide text-slate-500">${h.hora ? h.hora + " · " : ""}${h.etapa}</div>
          <p className="mt-1 font-semibold text-slate-900">${h.escolha}</p>
          <p className="mt-1 text-slate-700">${h.feedback}</p>
          <${ChipsImpacto} impacto=${h.impacto} />
        </li>`)}</ol>
        <div className="linha mt-4">
          <button type="button" className="primario" onClick=${() => iniciar(caso)}>Jogar novamente</button>
          <button type="button" className="secundario" onClick=${sair}>Voltar à lista de casos</button>
        </div>
      </section>
    </div>`;
  }

  // ---- Decisão em andamento ----
  return html`<div>
    <${KpisPlantao} kpis=${kpis} limite=${limite} />
    <section className="painel" aria-labelledby="t-fase">
      <div className="mb-3 flex flex-wrap items-center gap-2">
        <span className="selo neutro">${caso.setor || "Plantão"}</span>
        ${no.hora && html`<span className="selo bg-slate-100 text-slate-600">${no.hora}</span>`}
        <span className="selo bg-slate-100 text-slate-600">Decisão ${hist.length + 1}</span>
        <button type="button" className="secundario ml-auto min-h-0 px-3 py-1 text-sm" onClick=${sair}>Abandonar caso</button>
      </div>
      ${hist.length === 0 && html`<p className="mb-4 rounded-lg bg-slate-50 p-3 text-sm leading-relaxed text-slate-700 ring-1 ring-slate-200"><strong>Cenário:</strong> ${caso.descricao}</p>`}
      <h2 id="t-fase">${no.titulo}</h2>
      <p className="text-[15px] leading-relaxed text-slate-700">${no.texto}</p>
      ${no.dados && html`<dl className="linhas-est mt-3">${no.dados.map(([r, v]) => html`<div key=${r} className="esp"><dt>${r}</dt><dd>${v}</dd></div>`)}</dl>`}
      ${g && html`<div className="mt-4">
        <${GraficoExercicio} niveis=${z} aval=${aval} revelar=${!!escolha} />
        <p className="leg dica">${g.niveis.map((n, k) => html`<span key=${k}><i style=${{ background: COR_NIVEIS[k] }}></i>${n.nome}</span>`)} · ${g.analito}${g.unidade ? " (" + g.unidade + ")" : ""}. As marcações das regras aparecem depois da sua decisão.</p>
      </div>`}
      <h3 className="mt-5 text-base">O que você faz?</h3>
      <div className="opcoes" role="group" aria-label="Opções de decisão">
        ${no.opcoes.map((o, k) => html`<button key=${k} type="button" disabled=${!!escolha && escolha !== o}
          className=${"opcao" + (escolha === o ? " certa" : "")} onClick=${() => !escolha && escolher(o)}>${String.fromCharCode(65 + k)}) ${o.texto}</button>`)}
      </div>
      ${escolha && html`<div className="feedback certo" role="status">
        <h3>Impacto da decisão</h3>
        <p>${escolha.feedback}</p>
        ${aval && html`<p><strong>O Motor de Regras detectou neste gráfico:</strong> ${detectadas.length ? detectadas.map(v => rotuloTxt(v.regra) + " (" + v.tipo.toLowerCase() + ", Dia " + (v.dia + 1) + ")").join("; ") : "nenhuma violação"}.</p>`}
        <${ChipsImpacto} impacto=${escolha.impacto} />
        <div className="linha mt-3"><button type="button" className="primario" onClick=${continuar}>Continuar</button></div>
      </div>`}
    </section>
  </div>`;
}

/* =====================================================================
   APLICATIVO — COMO O ESTADO MUDOU PARA SUPORTAR VÁRIOS NÍVEIS
   ---------------------------------------------------------------------
   ANTES:  valores   = [100, 102, 98, ...]               (uma lista só)
   AGORA:  config    = { numNiveis, niveis: [ {modo, alvo, sd, min, max, k} × 3 ] }
                       → parâmetros ESPERADOS de cada nível (como texto digitado)
           corridas  = [ [n1, n2, n3], [n1, n2, n3], ... ]
                       → uma LINHA por dia; cada linha tem 3 posições (nível 1, 2, 3).
                         Posição de nível desativado ou não analisado no dia = null.
           entradas  = ["", "", ""]   → texto dos campos do formulário do dia
           modoGrafico = "separados" → como os gráficos são exibidos (separados, juntos em Z-Score, ou ambos)
   Derivados (não são estado, são recalculados a cada render):
           parametros → {alvo, sd} de cada nível ativo, via calcularParametros
           pronto     → true se todos os níveis ativos têm parâmetros válidos
   Reduzir o nº de níveis NÃO apaga dados: os valores continuam em corridas e
   voltam a aparecer se o nível for reativado (dias antigos ficam com "—").
   ===================================================================== */
const ABAS = [
  ["painel", "Painel de Controle (Gráficos)", "M3 3v18h18M7 15l4-4 3 3 5-6", "Painel de Controle", "Resultados, gráficos de Levey-Jennings e alertas das regras de Westgard"],
  ["config", "Configurações de Regras e Níveis", "M4 7h9M17 7h3M4 17h3M11 17h9M15 4v6M9 14v6", "Configurações de Regras e Níveis", "Alvo e SD de cada nível e severidade de cada regra (desativada, alerta ou rejeição)"],
  ["treino", "Modo Treinamento", "M12 3 2 8l10 5 10-5-10-5zM6 10.5V16c0 1 2.7 3 6 3s6-2 6-3v-5.5", "Modo Treinamento", "Exercícios interativos e guia das regras de Westgard"],
  ["labsim", "LabSim (Plantão)", "M12 6v6l4 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z", "LabSim · Plantão Laboratorial", "Simulador de decisões em um plantão de laboratório clínico"],
  ["fundamentos", "Fundamentação & História", "M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14zM20 17v4H6.5A2.5 2.5 0 0 1 4 18.5", "Fundamentação & História", "Do controle estatístico industrial ao planejamento da qualidade baseado em risco"]
];
function Icone({ d }) {
  return html`<svg className="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d=${d} /></svg>`;
}

function App() {
  // PERSISTÊNCIA: estes estados são salvos no localStorage (ver useEstadoPersistente)
  const [config, setConfig] = useEstadoPersistente("config", CONFIG_INICIAL, saneConfig);          // níveis, alvo e SD
  const [corridas, setCorridas] = useEstadoPersistente("corridas", [], saneCorridas);               // resultados digitados
  const [regrasCfg, setRegrasCfg] = useEstadoPersistente("regras", CFG_PADRAO, saneRegras);         // severidade das regras
  const [modoGrafico, setModoGrafico] = useEstadoPersistente("modoGrafico", "separados", saneEm(["separados", "juntos", "ambos"]));
  const [limiteSD, setLimiteSD] = useEstadoPersistente("limiteSD", 3, saneLimite);                // SD máximo exibido nos gráficos (2 ou 3)
  const [aba, setAba] = useEstadoPersistente("aba", "painel", saneEm(["painel", "config", "treino", "labsim", "fundamentos"]));
  // Estado temporário (não persiste): texto dos campos do formulário e mensagem de erro
  const [entradas, setEntradas] = useState(["", "", ""]);
  const [erro, setErro] = useState("");

  const { numNiveis } = config;
  const parametros = config.niveis.slice(0, numNiveis).map(calcularParametros);
  const pronto = parametros.every(p => p !== null);
  const mostrarJuntos = modoGrafico !== "separados";
  const mostrarSeparados = modoGrafico !== "juntos";
  const aval = avaliarRegras(montarZ(corridas, parametros), regrasCfg);   // MOTOR DE REGRAS: roda a cada render
  const daUltima = aval.violacoes.filter(v => v.dia === aval.ultimoDia);
  const status = aval.ultimoDia < 0 ? ["neutro", "Sem dados"]
    : daUltima.some(v => v.tipo === "Rejeição") ? ["rejeicao", "Última corrida: rejeição"]
    : daUltima.length ? ["alerta", "Última corrida: alerta"] : ["neutro", "Última corrida: em controle"];
  const [, , , titulo, subtitulo] = ABAS.find(a => a[0] === aba);

  function adicionar(e) {
    e.preventDefault();
    if (!pronto) { setErro("Complete a configuração dos níveis antes de inserir resultados."); return; }
    if (corridas.length >= MAX_DIAS) { setErro("Limite de " + MAX_DIAS + " dias atingido."); return; }
    const linha = [null, null, null];
    let algum = false;
    for (let i = 0; i < numNiveis; i++) {
      if (entradas[i].trim() === "") continue;   // em branco = nível não analisado neste dia
      const v = converterNumero(entradas[i]);
      if (v === null) { setErro("Valor inválido no Nível " + (i + 1) + ". Digite um número, por exemplo 12,5 ou 100."); return; }
      linha[i] = v; algum = true;
    }
    if (!algum) { setErro("Digite o resultado de pelo menos um nível."); return; }
    setCorridas([...corridas, linha]);   // nova lista: o React exige não alterar a antiga (e o localStorage grava)
    setEntradas(["", "", ""]);
    setErro("");
  }

  // Remove UM resultado (um nível em um dia). O dia continua existindo (a numeração dos dias não muda);
  // se o dia ficar sem nenhum resultado, ele é removido. Tudo (estatísticas, gráficos, alertas e
  // localStorage) se atualiza sozinho, porque é calculado a partir de "corridas" a cada render.
  function removerPonto(dia, nivel) {
    setCorridas(cs => cs.map((r, j) => (j === dia ? r.map((v, k) => (k === nivel ? null : v)) : r)).filter(r => r.some(v => v !== null)));
  }
  // Remove a corrida (dia) inteira; os dias seguintes são renumerados.
  function removerDia(dia) { setCorridas(cs => cs.filter((_, j) => j !== dia)); }

  function limpar() {
    if (corridas.length === 0 || window.confirm("Apagar todos os resultados? A configuração dos níveis será mantida.")) {
      setCorridas([]); setEntradas(["", "", ""]); setErro("");
    }
  }

  // Apaga TUDO que está salvo no navegador e volta aos padrões (o useEffect do hook regrava os padrões).
  function apagarTudo() {
    if (!window.confirm("Apagar todos os dados salvos neste navegador (níveis, regras e resultados)?")) return;
    setConfig(CONFIG_INICIAL); setCorridas([]); setRegrasCfg({ ...CFG_PADRAO }); setLimiteSD(3); setEntradas(["", "", ""]); setErro("");
  }

  return html`<div className="min-h-screen md:flex">
    <aside className="bg-slate-900 text-slate-300 md:sticky md:top-0 md:flex md:h-screen md:w-64 md:shrink-0 md:flex-col">
      <div className="flex items-center gap-3 px-5 py-4 md:py-6">
        <div className="flex h-10 w-10 items-center justify-center rounded-lg bg-gradient-to-br from-emerald-500 to-teal-600 text-lg font-extrabold text-white shadow-md">Q</div>
        <div><div className="text-lg font-bold leading-tight text-white">QualiLab</div><div className="text-xs text-emerald-300">Aprenda. Simule. Melhore.</div></div>
      </div>
      <nav aria-label="Navegação principal" className="flex gap-1 overflow-x-auto px-3 pb-3 md:flex-1 md:flex-col md:pb-0">
        ${ABAS.map(([id, rotulo, icone]) => html`<button key=${id} type="button" aria-current=${aba === id ? "page" : undefined} onClick=${() => setAba(id)}
          className=${"flex items-center gap-3 whitespace-nowrap text-left text-sm " + (aba === id ? "bg-emerald-600 text-white shadow-md" : "text-slate-300 hover:bg-slate-800 hover:text-white")}>
          <${Icone} d=${icone} />${rotulo}</button>`)}
      </nav>
      <div className="hidden px-5 py-4 text-xs text-slate-400 md:block">✓ Dados salvos automaticamente neste navegador.</div>
    </aside>

    <main className="min-w-0 flex-1 p-4 md:p-8">
      <header className="mb-5 flex flex-wrap items-end justify-between gap-3">
        <div><h1 className="text-2xl font-bold text-slate-900">${titulo}</h1><p className="text-sm text-slate-500">${subtitulo}</p></div>
        <div className="flex flex-wrap gap-2"><span className="selo neutro">${numNiveis} ${numNiveis === 1 ? "nível" : "níveis"}</span><span className="selo neutro">${corridas.length} ${corridas.length === 1 ? "corrida" : "corridas"}</span><span className=${"selo " + status[0]}>${status[1]}</span></div>
      </header>

      <p className="mb-5 rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-900">Simulação educacional: use valores fictícios (os valores iniciais são só exemplos). Não é orientação operacional; critérios e condutas reais dependem dos procedimentos e requisitos aplicáveis a cada laboratório.</p>

      ${aba === "painel" && html`<${React.Fragment}>
        <div className="grade">
          <${FormularioCorrida} numNiveis=${numNiveis} entradas=${entradas} setEntradas=${setEntradas} erro=${erro}
            pronto=${pronto} dia=${corridas.length + 1} cheio=${corridas.length >= MAX_DIAS} onAdicionar=${adicionar} onLimpar=${limpar} />
          <${ListaResultados} corridas=${corridas} numNiveis=${numNiveis} onRemoverPonto=${removerPonto} onRemoverDia=${removerDia} />
        </div>

        <section className="painel" aria-labelledby="t-niveis">
          <div className="mb-4 flex flex-wrap items-center justify-between gap-3">
            <h2 id="t-niveis" className="mb-0">Levey-Jennings e estatísticas por nível</h2>
            <div role="radiogroup" aria-label="Modo de visualização dos gráficos" className="inline-flex rounded-lg bg-slate-100 p-1">
              ${[["separados", "Níveis separados"], ["juntos", "Todos juntos (Z-Score)"], ["ambos", "Separados e juntos"]].map(([valor, rotulo]) =>
                html`<button key=${valor} type="button" role="radio" aria-checked=${modoGrafico === valor} onClick=${() => setModoGrafico(valor)}
                  className=${"min-h-0 rounded-md px-3 py-1.5 text-sm " + (modoGrafico === valor ? "bg-white text-emerald-800 shadow" : "text-slate-600 hover:text-slate-900")}>${rotulo}</button>`)}
            </div>
          </div>
          ${mostrarJuntos && html`<div className="bloco-nivel">
            <h3>Todos os níveis juntos · Z-Score</h3>
            <${GraficoZScore} corridas=${corridas} parametros=${parametros} aval=${aval} limiteSD=${limiteSD} />
          </div>`}
          ${mostrarSeparados && parametros.map((p, i) => html`<div key=${i} className="bloco-nivel">
            <h3>Nível ${i + 1}</h3>
            <${NivelPainel} idx=${i} parametros=${p} corridas=${corridas} aval=${aval} limiteSD=${limiteSD} />
          </div>`)}
          <p className="dica leg">As linhas de referência são fixas e vêm do Alvo e SD esperados da configuração. Marcação dos pontos:<i style=${{ background: COR_REJEICAO }}></i>regra de rejeição<i style=${{ background: COR_ALERTA }}></i>alerta</p>
        </section>

        <${AlertasSistema} aval=${aval} />
      <//>`}

      ${aba === "config" && html`<${React.Fragment}>
        <${PainelConfiguracao} config=${config} setConfig=${setConfig} limiteSD=${limiteSD} />
        <${PainelLimite} limiteSD=${limiteSD} setLimiteSD=${setLimiteSD} />
        <${PainelRegras} regrasCfg=${regrasCfg} setRegrasCfg=${setRegrasCfg} />
        <section className="painel" aria-labelledby="t-dados">
          <h2 id="t-dados">Dados salvos neste navegador</h2>
          <p className="dica" style=${{ marginTop: 0 }}>Níveis, regras e resultados ficam guardados no navegador e voltam ao atualizar a página. Eles não são enviados a nenhum servidor.</p>
          <div className="linha" style=${{ marginTop: "12px" }}><button type="button" className="secundario" onClick=${apagarTudo}>Apagar dados salvos</button></div>
        </section>
      <//>`}

      ${aba === "treino" && html`<${React.Fragment}><${Treinamento} /><${GuiaWestgard} /><//>`}

      ${aba === "labsim" && html`<${LabSim} />`}

      ${aba === "fundamentos" && html`<${Fundamentos} onIrPara=${setAba} />`}

      <footer className="mt-8 border-t border-slate-200 pt-4 text-sm text-slate-500">QualiLab · módulo Simulador Analítico · conteúdo fictício para fins educacionais.</footer>
    </main>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
